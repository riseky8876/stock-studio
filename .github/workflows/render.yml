name: Render Stock Batches

# Batch render Remotion -> out/<id>.mp4, lalu generate metadata/metadata.csv.
# Upload ke Adobe Stock tetap MANUAL (ada di portal) — tidak ada di sini.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # setiap Senin 06:00 UTC -> auto batch
  push:
    branches: [main]
    paths:
      - "projects/stock-video/**"
      - "skills/stock-metadata/**"
      - "metadata/**"

permissions:
  contents: read
  issues: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install
        working-directory: projects/stock-video

      - name: Generate variations
        run: node projects/stock-video/scripts/generate-variations.mjs

      - name: Render all variations
        run: node render/batch.mjs
        working-directory: projects/stock-video

      - name: Generate metadata.csv
        run: |
          node skills/stock-metadata/scripts/gen-metadata.mjs \
            --manifest projects/stock-video/variations.json \
            --out metadata/metadata.csv

      - name: Upload rendered clips
        uses: actions/upload-artifact@v4
        with:
          name: stock-clips
          path: projects/stock-video/out/*.mp4
          if-no-files-found: error

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: stock-metadata
          path: metadata/metadata.csv
          if-no-files-found: error

  notify:
    needs: render
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open issue when batch fails
        if: ${{ needs.render.result == 'failure' && github.event_name != 'schedule' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Stock batch failed: ${context.sha.slice(0, 7)}`,
              body: [
                `Batch render gagal pada commit \`${context.sha.slice(0, 7)}\`.`,
                ``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['stock', 'bug'],
            });

      - name: Open issue when batch is ready
        if: ${{ needs.render.result == 'success' && github.event_name != 'schedule' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Stock batch ready: ${context.sha.slice(0, 7)}`,
              body: [
                `Batch render berhasil pada commit \`${context.sha.slice(0, 7)}\`.`,
                ``,
                `Clips + metadata tersedia di workflow run:`,
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['stock', 'ready'],
            });
